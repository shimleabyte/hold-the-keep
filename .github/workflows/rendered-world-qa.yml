name: Rendered World QA

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/rendered-world-qa.yml"
      - "scripts/world/**"
      - "scripts/systems/enemy_civilization.gd"
      - "scripts/systems/nav_grid.gd"
      - "scripts/entities/enemy_economic_worker.gd"
      - "scripts/entities/enemy_keep.gd"
      - "scripts/entities/enemy_settlement_structure.gd"
      - "tests/rival_physical_workforce.gd"
      - "tests/rival_physical_workforce_headed.gd"
      - "scripts/autoload/world_config.gd"
      - "scripts/entities/resource_tree.gd"
      - "scripts/entities/rock.gd"
      - "scripts/entities/iron_ore.gd"
      - "scripts/entities/wildlife_node.gd"
      - "scripts/entities/frontier_decoration.gd"
      - "assets/sprites/**"
      - "tools/gen_assets.py"
      - "tests/shot_frontier_seed_compare.gd"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rendered-world-qa.yml"
      - "scripts/world/**"
      - "scripts/systems/enemy_civilization.gd"
      - "scripts/systems/nav_grid.gd"
      - "scripts/entities/enemy_economic_worker.gd"
      - "scripts/entities/enemy_keep.gd"
      - "scripts/entities/enemy_settlement_structure.gd"
      - "tests/rival_physical_workforce.gd"
      - "tests/rival_physical_workforce_headed.gd"
      - "scripts/autoload/world_config.gd"
      - "scripts/entities/resource_tree.gd"
      - "scripts/entities/rock.gd"
      - "scripts/entities/iron_ore.gd"
      - "scripts/entities/wildlife_node.gd"
      - "scripts/entities/frontier_decoration.gd"
      - "assets/sprites/**"
      - "tools/gen_assets.py"
      - "tests/shot_frontier_seed_compare.gd"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rendered-world-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontier-same-seed-render:
    name: Frontier same-seed rendered comparison · Godot 4.7
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.7.0"
          use-dotnet: false

      - name: Install Xvfb and Mesa
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0

      - name: Import project
        run: godot --headless --path . --import

      - name: Render and compare the Frontier map twice
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          mkdir -p /tmp/hold-the-keep-rendered-qa
          touch /tmp/hold-the-keep-rendered-qa/render.log
          timeout --signal=TERM --kill-after=15s 300s \
            xvfb-run -a -s "-screen 0 1600x900x24" \
            godot --path . --rendering-driver opengl3 --fixed-fps 30 \
            --script res://tests/shot_frontier_seed_compare.gd \
            2>&1 | tee /tmp/hold-the-keep-rendered-qa/render.log

      - name: Upload rendered captures and difference image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-rendered-seed-1337-godot-4.7
          path: |
            /tmp/hold-the-keep-rendered-qa/*.png
            /tmp/hold-the-keep-rendered-qa/render.log
          if-no-files-found: warn
          retention-days: 14

  rival-physical-workforce-headed:
    name: Rival physical workforce headed acceptance · Godot 4.7
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.7.0"
          use-dotnet: false

      - name: Install Xvfb, Mesa and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 ffmpeg

      - name: Import project
        run: godot --headless --path . --import

      - name: Launch actual Godot window and run rival workforce scenario
        env:
          HTK_AUTO_RESOLVE_EVENTS: "1"
          HTK_AUTO_START_GAME: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          mkdir -p build/diagnostics/rival-workforce-headed
          timeout --signal=TERM --kill-after=15s 720s \
            xvfb-run -a -s "-screen 0 1600x900x24" \
            godot --path . --rendering-driver opengl3 --fixed-fps 60 \
            --script res://tests/rival_physical_workforce_headed.gd \
            2>&1 | tee build/diagnostics/rival-workforce-headed/headed-acceptance.log
          test -s build/diagnostics/rival-workforce-headed/settlement-overview.png
          test -s build/diagnostics/rival-workforce-headed/worker-close-up.png
          test -s build/diagnostics/rival-workforce-headed/movement/00.png

      - name: Encode worker movement capture
        run: |
          ffmpeg -y -framerate 2 -i build/diagnostics/rival-workforce-headed/movement/%02d.png \
            -vf "fps=8,scale=800:-1:flags=neighbor,split[s0][s1];[s0]palettegen=max_colors=128[p];[s1][p]paletteuse=dither=none" \
            -loop 0 build/diagnostics/rival-workforce-headed/rival-worker-movement.gif

      - name: Upload headed rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rival-physical-workforce-headed-godot-4.7
          path: build/diagnostics/rival-workforce-headed/
          if-no-files-found: warn
          retention-days: 14
