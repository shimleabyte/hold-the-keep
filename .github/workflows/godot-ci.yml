name: Godot CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Godot 4.7 · import and parse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate asset generator syntax
        run: python3 -m py_compile tools/gen_assets.py

      - name: Verify role sprite generator reproducibility
        run: python3 tools/check_role_sprite_reproducibility.py

      - name: Upload generated role sprite candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-role-sprite-candidates
          path: build/generated-role-sprites/*.svg
          if-no-files-found: warn
          retention-days: 7

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.7.0"
          use-dotnet: false

      - name: Import project
        run: godot --headless --path . --import

      - name: Parse every GDScript file
        run: bash tools/check_gdscript.sh

  regression:
    name: Godot 4.7 · ${{ matrix.test }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        test:
          - player_attack_sprite_pose
          - animation_motion
          - campaign_assault
          - campaign_multi_stronghold
          - workplace_assignments
          - villager_lifecycle_recovery
          - hunting_lodge
          - scout_specialist
          - healer_infirmary
          - blacksmith_forge
          - archery_range
          - production_worksites
          - construction_sites
          - watchtower_vision
          - granary_food_storage
          - faction_registry
          - faction_visual_identity
          - role_sprite_identity
          - building_visual_identity
          - combat_visual_feedback
          - audio_identity
          - frontier_campaign
          - frontier_stress
          - campaign_reload_hardening
          - campaign_balance_matrix
          - campaign_combat_simulation
          - data_db_validation
          - save_validator
          - save_file_store_recovery
          - save_migration_pipeline
          - decision_events
          - release_hardening
          - input_rebinding
          - building_controls
          - map_stages
          - player_combat_flow
          - army_command_and_rival_civilization
          - rival_civilization_persistence
          - legacy_world_dimensions
          - player_combat
          - resource_save_state
          - responsive_layout
          - territory_claims
          - world_config
          - frontier_world
          - frontier_expedition
          - regional_control_roads
          - local_depot_stockpiles
          - outpost_garrisons
          - physical_shipments
          - depot_cost_sources
          - supply_pressure
          - shieldbearer_behavior
          - scout_marking
          - saboteur_disruption
          - siege_engine_behavior
          - beast_rider_charge
          - faction_camps_patrols
          - faction_raids
          - faction_warfare_stress
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.7.0"
          use-dotnet: false

      - name: Import project
        run: godot --headless --path . --import

      - name: Run ${{ matrix.test }}
        env:
          HTK_AUTO_RESOLVE_EVENTS: "1"
          HTK_AUTO_START_GAME: "1"
        run: timeout 180s godot --headless --fixed-fps 60 --path . --script "res://tests/${{ matrix.test }}.gd"

  construction-spike-diagnostic:
    name: Construction completion frame-spike diagnostic · Godot 4.7
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.7.0"
          use-dotnet: false

      - name: Import project
        run: godot --headless --path . --import

      - name: Measure Classic, Frontier and Expedition construction transitions
        env:
          HTK_AUTO_RESOLVE_EVENTS: "1"
        run: |
          mkdir -p build/diagnostics
          timeout 600s godot --headless --fixed-fps 60 --path . --script res://tools/performance_probe.gd 2>&1 | tee build/diagnostics/construction-spikes.txt
          grep -q '"building_completion_transition"' build/diagnostics/construction-spikes.txt

      - name: Upload construction completion measurements
        uses: actions/upload-artifact@v4
        with:
          name: construction-completion-frame-spikes-godot-4.7
          path: build/diagnostics/construction-spikes.txt
          if-no-files-found: error

  performance-diagnostic:
    name: Frontier performance diagnostic · Godot 4.7
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.7.0"
          use-dotnet: false

      - name: Import project
        run: godot --headless --path . --import

      - name: Run reference Frontier workload
        env:
          HTK_AUTO_START_GAME: "1"
          PROFILE: frontier
          ENEMIES: "96"
          VILLAGERS: "80"
          FRAMES: "360"
          WARMUP: "90"
          HTK_AUTO_RESOLVE_EVENTS: "1"
        run: |
          mkdir -p build/diagnostics
          godot --headless --fixed-fps 60 --path . --script res://tests/perf.gd 2>&1 | tee build/diagnostics/frontier-perf.txt
          grep -q "^PERF_REPORT " build/diagnostics/frontier-perf.txt
          if grep -q "^SCRIPT ERROR:" build/diagnostics/frontier-perf.txt; then
            echo "Frontier workload emitted GDScript errors"
            exit 1
          fi

      - name: Run Frontier Expedition reference workload
        env:
          HTK_AUTO_START_GAME: "1"
          PROFILE: frontier_expedition
          ENEMIES: "96"
          VILLAGERS: "80"
          FRAMES: "180"
          WARMUP: "45"
          HTK_AUTO_RESOLVE_EVENTS: "1"
        run: |
          godot --headless --fixed-fps 60 --path . --script res://tests/perf.gd 2>&1 | tee build/diagnostics/frontier-expedition-perf.txt
          grep -q "^PERF_REPORT " build/diagnostics/frontier-expedition-perf.txt
          if grep -q "^SCRIPT ERROR:" build/diagnostics/frontier-expedition-perf.txt; then
            echo "Frontier Expedition workload emitted GDScript errors"
            exit 1
          fi

      - name: Upload Frontier Expedition performance report
        uses: actions/upload-artifact@v4
        with:
          name: frontier-expedition-performance-godot-4.7
          path: build/diagnostics/frontier-expedition-perf.txt
          if-no-files-found: error

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: frontier-performance-godot-4.7
          path: build/diagnostics/frontier-perf.txt
          if-no-files-found: error

