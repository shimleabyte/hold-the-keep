name: Godot CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Godot ${{ matrix.godot-version }} · import and parse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        godot-version: ["4.3.0", "4.7.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ matrix.godot-version }}
          use-dotnet: false

      - name: Import project
        run: godot --headless --path . --import

      - name: Parse every GDScript file
        run: bash tools/check_gdscript.sh

  regression:
    name: Godot ${{ matrix.godot-version }} · ${{ matrix.test }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        godot-version: ["4.3.0", "4.7.0"]
        test:
          - animation_motion
          - campaign_assault
          - campaign_multi_stronghold
          - workplace_assignments
          - production_worksites
          - faction_registry
          - faction_visual_identity
          - building_visual_identity
          - combat_visual_feedback
          - audio_identity
          - frontier_campaign
          - frontier_stress
          - campaign_reload_hardening
          - campaign_balance_matrix
          - release_hardening
          - input_rebinding
          - map_stages
          - player_combat
          - resource_save_state
          - responsive_layout
          - territory_claims
          - world_config
          - frontier_world
          - regional_control_roads
          - local_depot_stockpiles
          - outpost_garrisons
          - physical_shipments
          - depot_cost_sources
          - supply_pressure
          - shieldbearer_behavior
          - scout_marking
          - saboteur_disruption
          - siege_engine_behavior
          - beast_rider_charge
          - faction_camps_patrols
          - faction_raids
          - faction_warfare_stress
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ matrix.godot-version }}
          use-dotnet: false

      - name: Import project
        run: godot --headless --path . --import

      - name: Run ${{ matrix.test }}
        run: timeout 180s godot --headless --fixed-fps 60 --path . --script "res://tests/${{ matrix.test }}.gd"

  performance-diagnostic:
    name: Frontier performance diagnostic · Godot 4.7
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.7.0"
          use-dotnet: false

      - name: Import project
        run: godot --headless --path . --import

      - name: Run reference Frontier workload
        env:
          PROFILE: frontier
          ENEMIES: "96"
          VILLAGERS: "80"
          FRAMES: "360"
          WARMUP: "90"
        run: |
          mkdir -p build/diagnostics
          godot --headless --fixed-fps 60 --path . --script res://tests/perf.gd 2>&1 | tee build/diagnostics/frontier-perf.txt
          grep -q "^PERF_REPORT " build/diagnostics/frontier-perf.txt

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: frontier-performance-godot-4.7
          path: build/diagnostics/frontier-perf.txt
          if-no-files-found: error

  release-export:
    name: Windows + Linux release export · Godot 4.3
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Godot and matching export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false
          include-templates: true

      - name: Build Windows and Linux releases
        run: GODOT=godot bash tools/build.sh

      - name: Verify Windows executable format
        run: |
          file build/windows/HoldTheKeep.exe
          file build/windows/HoldTheKeep.exe | grep -E "PE32|MS Windows"

      - name: Smoke-test Linux release
        run: timeout 30s build/linux/HoldTheKeep.x86_64 --headless --quit-after 5

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: hold-the-keep-desktop-godot-4.3
          path: |
            build/windows/HoldTheKeep.exe
            build/linux/HoldTheKeep.x86_64
          if-no-files-found: error
