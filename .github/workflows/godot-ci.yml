name: Godot CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Godot ${{ matrix.godot-version }} · import and parse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        godot-version: ["4.3.0", "4.7.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ matrix.godot-version }}
          use-dotnet: false

      - name: Import project
        run: godot --headless --path . --import

      - name: Parse every GDScript file
        run: bash tools/check_gdscript.sh

  regression:
    name: Godot ${{ matrix.godot-version }} · ${{ matrix.test }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        godot-version: ["4.3.0", "4.7.0"]
        test:
          - animation_motion
          - campaign_assault
          - campaign_multi_stronghold
          - workplace_assignments
          - production_worksites
          - faction_registry
          - frontier_campaign
          - frontier_stress
          - campaign_reload_hardening
          - release_hardening
          - input_rebinding
          - map_stages
          - player_combat
          - resource_save_state
          - responsive_layout
          - territory_claims
          - world_config
          - frontier_world
          - regional_control_roads
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ matrix.godot-version }}
          use-dotnet: false

      - name: Import project
        run: godot --headless --path . --import

      - name: Run ${{ matrix.test }}
        run: timeout 180s godot --headless --fixed-fps 60 --path . --script "res://tests/${{ matrix.test }}.gd"
